<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --dim: var(--figma-color-text-secondary, #8c8c8c);
    --border: var(--figma-color-border, #e6e6e6);
    --hover: var(--figma-color-bg-hover, #f0f0f0);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --onbrand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #f24822);
    --warn: var(--figma-color-text-warning, #a07800);
    --ok: var(--figma-color-text-success, #009951);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font: 11px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  nav { display: flex; border-bottom: 1px solid var(--border); }
  nav button {
    flex: 1; padding: 10px; border: none; background: none; color: var(--dim);
    font: inherit; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav button.on { color: var(--text); border-bottom-color: var(--brand); }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
  section { display: none; flex-direction: column; gap: 10px; }
  section.on { display: flex; }
  h2 { margin: 4px 0 0; font-size: 11px; font-weight: 600; }
  .card { border: 1px solid var(--border); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .hint { color: var(--dim); margin: 0; }
  input[type="text"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--text); font: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--brand); }
  .btn {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg);
    color: var(--text); font: inherit; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--onbrand); font-weight: 600; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .checks li.pass { color: var(--ok); }
  .checks li.fail { color: var(--danger); }
  .picked { display: flex; align-items: center; gap: 8px; }
  .picked img { width: 32px; height: 32px; object-fit: contain; background: var(--bg2); border-radius: 4px; }
  .list { border: 1px solid var(--border); border-radius: 6px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .item img { width: 24px; height: 24px; flex: none; }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--dim); font-size: 10px; white-space: nowrap; }
  .item .meta.full { color: var(--ok); }
  .item .acts { display: flex; gap: 4px; }
  .item .acts .btn { padding: 3px 6px; font-size: 10px; }
  .item.pick { cursor: pointer; }
  .item.pick:hover { background: var(--hover); }
  .item.selected { background: var(--brand); color: var(--onbrand); }
  .item.selected .meta { color: var(--onbrand); }
  .item.archived { opacity: 0.6; }
  .empty { padding: 10px; color: var(--dim); }
  footer { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  #status { min-height: 16px; white-space: pre-wrap; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  #publish { color: var(--warn); display: none; }
  .hidden { display: none; }
  textarea {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--text); font: inherit; outline: none; resize: vertical;
  }
  textarea:focus { border-color: var(--brand); }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: 1; }
  ol.guide { margin: 0; padding-left: 16px; color: var(--dim); }
  #ai-preview { height: 84px; font-size: 10px; color: var(--dim); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .back { align-self: flex-start; padding: 0; border: none; background: none; color: var(--dim); font: inherit; cursor: pointer; }
  .back:hover { color: var(--text); }
</style>
</head>
<body>
  <nav>
    <button id="tab-icons" class="on">카테고리 아이콘</button>
    <button id="tab-mappin">mappin 생성</button>
  </nav>

  <main id="main">
    <section id="icons" class="on">
      <div class="card">
        <div class="card-head">
          <h2>새 아이콘 추가</h2>
          <button class="btn" id="go-ai">GPT로 만들기</button>
        </div>
        <p class="hint">정사각형 · 투명 배경 PNG · 72×72 이상</p>
        <div class="picked">
          <img id="add-preview" class="hidden" alt="" />
          <button class="btn" id="add-pick">이미지 선택</button>
          <span id="add-file" class="hint"></span>
        </div>
        <input type="text" id="add-name" placeholder="등록 이름 (영문 소문자 · 숫자 · _)" autocomplete="off" />
        <ul class="checks" id="add-checks"></ul>
        <button class="btn primary" id="add-go" disabled>추가</button>
      </div>

      <h2 id="active-title">아이콘</h2>
      <div class="list" id="active"></div>

      <h2 id="archived-title">보관</h2>
      <div class="list" id="archived"></div>
    </section>

    <section id="ai">
      <button class="back" id="ai-back">← 카테고리 아이콘</button>
      <div class="card">
        <h2>GPT로 아이콘 이미지 만들기</h2>
        <input type="text" id="ai-name" placeholder="카테고리 이름 (예: 소떡소떡)" autocomplete="off" />
        <textarea id="ai-desc" rows="2" placeholder="설명 (선택) 예: 소시지와 떡을 번갈아 꽂은 꼬치"></textarea>
        <div class="row">
          <button class="btn" id="ai-sheet">아이콘 모음 이미지 복사</button>
          <button class="btn" id="ai-prompt" disabled>프롬프트 복사</button>
        </div>
        <textarea id="ai-preview" readonly placeholder="카테고리 이름을 적으면 프롬프트가 여기에 만들어져요"></textarea>
        <ol class="guide">
          <li>ChatGPT에 아이콘 모음 이미지 붙여넣기</li>
          <li>카테고리 사진을 이어서 첨부</li>
          <li>프롬프트를 붙여넣고 보내기</li>
          <li>만들어진 이미지를 PNG로 저장</li>
        </ol>
        <button class="btn primary" id="ai-done">이미지 등록하러 가기</button>
      </div>
    </section>

    <section id="mappin">
      <p class="hint">mappin이 없거나 일부만 있는 아이콘입니다. 고르면 빠진 행만 채웁니다.</p>
      <div class="list" id="todo"></div>
      <button class="btn primary" id="gen-go" disabled>mappin 만들기</button>
    </section>
  </main>

  <footer>
    <div id="status">불러오는 중…</div>
    <div id="publish">변경사항은 Design System 라이브러리를 게시해야 다른 파일에 반영됩니다.</div>
  </footer>

  <input type="file" id="file" accept="image/png" class="hidden" />

<script>
  var MIN_PX = 72;
  var NAME_RULE = /^[a-z0-9_]+$/;
  var state = { icons: [], rowCount: 0 };
  var thumbs = {};
  var addImage = null;
  var genPick = null;
  var fileTarget = null;
  var renaming = null;
  var busy = false;

  function $(id) { return document.getElementById(id); }
  function send(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }

  function setStatus(text, kind) {
    $('status').textContent = text || '';
    $('status').className = kind || '';
  }

  function setBusy(on, text) {
    busy = on;
    if (on) setStatus(text || '처리 중…');
    renderAddChecks();
    $('gen-go').disabled = on || !genPick;
  }

  function tab(name) {
    ['icons', 'mappin', 'ai'].forEach(function (t) { $(t).classList.toggle('on', t === name); });
    $('tab-icons').classList.toggle('on', name === 'icons' || name === 'ai');
    $('tab-mappin').classList.toggle('on', name === 'mappin');
    $('main').scrollTop = 0;
  }
  $('tab-icons').onclick = function () { tab('icons'); };
  $('tab-mappin').onclick = function () { tab('mappin'); };
  $('go-ai').onclick = function () { tab('ai'); };
  $('ai-back').onclick = function () { tab('icons'); };
  $('ai-done').onclick = function () { tab('icons'); $('add-pick').focus(); };

  function thumbUrl(icon) {
    if (thumbs[icon.id]) URL.revokeObjectURL(thumbs[icon.id]);
    thumbs[icon.id] = URL.createObjectURL(new Blob([icon.thumb], { type: 'image/png' }));
    return thumbs[icon.id];
  }

  function inspectPng(file) {
    return new Promise(function (resolve) {
      if (!file || file.type !== 'image/png') {
        resolve({ ok: false, checks: [{ ok: false, text: 'PNG 파일만 받습니다.' }] });
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var g = canvas.getContext('2d');
        g.drawImage(img, 0, 0);
        var corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]].map(function (p) {
          return g.getImageData(p[0], p[1], 1, 1).data[3];
        });
        var checks = [
          { ok: w === h, text: '정사각형 (' + w + '×' + h + ')' },
          { ok: w >= MIN_PX && h >= MIN_PX, text: MIN_PX + '×' + MIN_PX + ' 이상' },
          { ok: corners.every(function (a) { return a === 0; }), text: '투명 배경 (네 모서리 투명)' }
        ];
        file.arrayBuffer().then(function (buf) {
          resolve({
            ok: checks.every(function (c) { return c.ok; }),
            checks: checks,
            bytes: new Uint8Array(buf),
            url: url,
            name: file.name
          });
        });
      };
      img.onerror = function () {
        resolve({ ok: false, checks: [{ ok: false, text: '이미지를 읽지 못했습니다.' }] });
      };
      img.src = url;
    });
  }

  function nameCheck(name, exceptId) {
    if (!name) return { ok: false, text: '이름을 입력해 주세요' };
    if (!NAME_RULE.test(name)) return { ok: false, text: '영문 소문자 · 숫자 · _ 만 가능' };
    var dup = state.icons.some(function (i) { return i.id !== exceptId && i.value === name; });
    if (dup) return { ok: false, text: '이미 있는 이름 (보관 포함)' };
    return { ok: true, text: '이름 사용 가능' };
  }

  function renderAddChecks() {
    var name = $('add-name').value.trim();
    var list = [];
    if (addImage) list = list.concat(addImage.checks);
    if (addImage || name) list.push(nameCheck(name));
    $('add-checks').innerHTML = '';
    list.forEach(function (c) {
      var li = document.createElement('li');
      li.className = c.ok ? 'pass' : 'fail';
      li.textContent = (c.ok ? '✓ ' : '✕ ') + c.text;
      $('add-checks').appendChild(li);
    });
    var ready = addImage && addImage.ok && nameCheck(name).ok;
    $('add-go').disabled = busy || !ready;
  }

  $('add-pick').onclick = function () { fileTarget = { kind: 'add' }; $('file').click(); };
  $('add-name').oninput = renderAddChecks;
  $('add-go').onclick = function () {
    setBusy(true, '추가하는 중…');
    send({ type: 'add', name: $('add-name').value.trim(), bytes: addImage.bytes });
  };

  $('file').onchange = function () {
    var file = $('file').files[0];
    var target = fileTarget;
    $('file').value = '';
    if (!file || !target) return;
    inspectPng(file).then(function (res) {
      if (target.kind === 'add') {
        addImage = res;
        $('add-file').textContent = res.name || '';
        $('add-preview').classList.toggle('hidden', !res.url);
        if (res.url) $('add-preview').src = res.url;
        renderAddChecks();
        return;
      }
      if (!res.ok) {
        setStatus(target.value + ' 이미지 교체 불가\n' + res.checks.filter(function (c) { return !c.ok; }).map(function (c) { return '✕ ' + c.text; }).join('\n'), 'error');
        return;
      }
      setBusy(true, target.value + ' 이미지를 교체하는 중…');
      send({ type: 'replace', id: target.id, bytes: res.bytes });
    });
  };

  function metaFor(icon) {
    if (!state.rowCount) return '';
    if (icon.pins === state.rowCount) return 'mappin ' + icon.pins + '/' + state.rowCount;
    if (icon.pins === 0) return 'mappin 없음';
    return 'mappin ' + icon.pins + '/' + state.rowCount;
  }

  function actButton(label, fn) {
    var b = document.createElement('button');
    b.className = 'btn';
    b.textContent = label;
    b.onclick = function (e) { e.stopPropagation(); if (!busy) fn(); };
    return b;
  }

  function iconRow(icon) {
    var row = document.createElement('div');
    row.className = 'item' + (icon.archived ? ' archived' : '');
    var img = document.createElement('img');
    img.src = thumbUrl(icon);
    row.appendChild(img);

    if (renaming === icon.id) {
      var input = document.createElement('input');
      input.type = 'text';
      input.value = icon.value;
      row.appendChild(input);
      var acts = document.createElement('div');
      acts.className = 'acts';
      acts.appendChild(actButton('저장', function () {
        var name = input.value.trim();
        var c = nameCheck(name, icon.id);
        if (name === icon.value) { renaming = null; render(); return; }
        if (!c.ok) { setStatus(c.text, 'error'); return; }
        setBusy(true, '이름을 바꾸는 중…');
        send({ type: 'rename', id: icon.id, name: name });
      }));
      acts.appendChild(actButton('취소', function () { renaming = null; render(); }));
      row.appendChild(acts);
      setTimeout(function () { input.focus(); input.select(); }, 0);
      return row;
    }

    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = icon.value;
    name.title = icon.raster ? '이미지 아이콘' : '벡터 아이콘';
    row.appendChild(name);

    var meta = document.createElement('span');
    meta.className = 'meta' + (icon.pins === state.rowCount ? ' full' : '');
    meta.textContent = icon.archived ? '보관됨' : metaFor(icon);
    row.appendChild(meta);

    var acts2 = document.createElement('div');
    acts2.className = 'acts';
    if (icon.archived) {
      acts2.appendChild(actButton('복원', function () {
        setBusy(true, icon.value + ' 복원 중…');
        send({ type: 'restore', id: icon.id });
      }));
    } else {
      acts2.appendChild(actButton('이미지', function () {
        fileTarget = { kind: 'replace', id: icon.id, value: icon.value };
        $('file').click();
      }));
      acts2.appendChild(actButton('이름', function () { renaming = icon.id; render(); }));
      acts2.appendChild(actButton('보관', function () {
        setBusy(true, icon.value + ' 보관 중…');
        send({ type: 'archive', id: icon.id });
      }));
    }
    row.appendChild(acts2);
    return row;
  }

  function fill(listEl, items, emptyText) {
    listEl.innerHTML = '';
    if (!items.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = emptyText;
      listEl.appendChild(e);
    }
    items.forEach(function (el) { listEl.appendChild(el); });
  }

  function render() {
    var active = state.icons.filter(function (i) { return !i.archived; });
    var archived = state.icons.filter(function (i) { return i.archived; });
    $('active-title').textContent = '아이콘 ' + active.length + '개';
    $('archived-title').textContent = '보관 ' + archived.length + '개';
    fill($('active'), active.map(iconRow), '아이콘이 없습니다.');
    fill($('archived'), archived.map(iconRow), '보관된 아이콘이 없습니다.');

    var todo = active.filter(function (i) { return i.pins < state.rowCount; });
    if (genPick && !todo.some(function (i) { return i.id === genPick; })) genPick = null;
    fill($('todo'), todo.map(function (icon) {
      var row = document.createElement('div');
      row.className = 'item pick' + (genPick === icon.id ? ' selected' : '');
      var img = document.createElement('img');
      img.src = thumbs[icon.id];
      row.appendChild(img);
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = icon.value;
      row.appendChild(name);
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = metaFor(icon);
      row.appendChild(meta);
      row.onclick = function () { if (busy) return; genPick = icon.id; render(); };
      return row;
    }), '모든 아이콘에 mappin이 있습니다.');
    $('gen-go').disabled = busy || !genPick;
    renderAddChecks();
  }

  // ---------- ChatGPT 도우미 ----------

  var sheetBlob = null;
  var sheetLoading = false;
  var sheetWaiters = [];

  function finalConsonant(word) {
    var c = word.charCodeAt(word.length - 1);
    if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
    return null;
  }

  function topicOf(word) {
    var fc = finalConsonant(word);
    return fc === true ? '은' : fc === false ? '는' : '은(는)';
  }

  function sentence(desc) {
    var d = desc.replace(/\s+$/, '');
    if (/[.!?]$/.test(d)) return d;
    if (/(다|요|야)$/.test(d)) return d + '.';
    var fc = finalConsonant(d);
    return d + (fc === true ? '이야.' : fc === false ? '야.' : '(이)야.');
  }

  function buildPrompt(name, desc) {
    var lines = [
      '첫 번째 사진은 우리 앱 서비스에서 쓰는 카테고리 아이콘들이야. 이 아이콘들의 특징(선 굵기, 색감, 명암, 단순한 정도)을 학습해서 "' + name + '" 아이콘을 하나 만들어줘.',
      '두 번째 사진부터는 ' + name + ' 사진이야. 생김새만 참고하고, 그림체는 첫 번째 사진의 아이콘들과 똑같이 맞춰줘.'
    ];
    if (desc) lines.push(name + topicOf(name) + ' ' + sentence(desc));
    lines.push(
      '',
      '꼭 지켜줘:',
      '- 정사각형 1024×1024, 배경은 완전히 투명한 PNG',
      '- 아이콘 하나만 가운데에, 가장자리에 여백을 두고',
      '- 글자, 배경색, 테두리 박스, 그림자는 넣지 않기',
      '- 24px로 아주 작게 봐도 무엇인지 알아볼 수 있을 만큼 단순하게'
    );
    return lines.join('\n');
  }

  function updatePrompt() {
    var name = $('ai-name').value.trim();
    var desc = $('ai-desc').value.trim();
    $('ai-preview').value = name ? buildPrompt(name, desc) : '';
    $('ai-prompt').disabled = !name;
  }
  $('ai-name').oninput = updatePrompt;
  $('ai-desc').oninput = updatePrompt;

  function requestSheet() {
    sheetBlob = null;
    sheetLoading = true;
    send({ type: 'reference' });
  }

  function composeSheet(icons) {
    var COLS = 8, CELL = 96, GAP = 24, PAD = 32;
    var rows = Math.max(1, Math.ceil(icons.length / COLS));
    var canvas = document.createElement('canvas');
    canvas.width = PAD * 2 + COLS * CELL + (COLS - 1) * GAP;
    canvas.height = PAD * 2 + rows * CELL + (rows - 1) * GAP;
    var g = canvas.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, canvas.width, canvas.height);
    return Promise.all(icons.map(function (bytes) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () { resolve(img); };
        img.onerror = function () { resolve(null); };
        img.src = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
      });
    })).then(function (imgs) {
      imgs.forEach(function (img, i) {
        if (!img) return;
        var scale = Math.min(CELL / img.naturalWidth, CELL / img.naturalHeight);
        var w = img.naturalWidth * scale, h = img.naturalHeight * scale;
        var x = PAD + (i % COLS) * (CELL + GAP) + (CELL - w) / 2;
        var y = PAD + Math.floor(i / COLS) * (CELL + GAP) + (CELL - h) / 2;
        g.drawImage(img, x, y, w, h);
        URL.revokeObjectURL(img.src);
      });
      return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/png'); });
    });
  }

  function sheetPromise() {
    if (sheetBlob) return Promise.resolve(sheetBlob);
    if (!sheetLoading) requestSheet();
    return new Promise(function (resolve, reject) { sheetWaiters.push({ resolve: resolve, reject: reject }); });
  }

  function settleSheet(blob, error) {
    var waiters = sheetWaiters;
    sheetWaiters = [];
    waiters.forEach(function (w) { if (blob) w.resolve(blob); else w.reject(error); });
  }

  function downloadBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  $('ai-sheet').onclick = function () {
    var p = sheetPromise();
    var copied = function () {
      setStatus('아이콘 모음 이미지를 복사했어요. ChatGPT 입력창에 붙여넣으세요.', 'ok');
    };
    var fallback = function () {
      p.then(function (blob) {
        downloadBlob(blob, 'category-icons.png');
        setStatus('클립보드 복사가 막혀 있어 category-icons.png로 저장을 시도했어요. 다운로드 폴더를 확인하고 ChatGPT에 끌어다 놓으세요.', 'ok');
      }).catch(function (e) {
        setStatus('아이콘 모음 이미지를 만들지 못했어요. ' + (e && e.message ? e.message : ''), 'error');
      });
    };
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('no clipboard');
      navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]).then(copied, fallback);
    } catch (e) {
      fallback();
    }
  };

  $('ai-prompt').onclick = function () {
    var text = $('ai-preview').value;
    if (!text) return;
    var copied = function () { setStatus('프롬프트를 복사했어요. ChatGPT에 붙여넣으세요.', 'ok'); };
    var legacy = function () {
      var ta = $('ai-preview');
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) copied();
      else setStatus('자동 복사가 막혀 있어요. 프롬프트 칸이 선택돼 있으니 Cmd+C로 복사해 주세요.', 'error');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(copied, legacy);
    else legacy();
  };

  $('gen-go').onclick = function () {
    if (!genPick) return;
    setBusy(true, 'mappin 만드는 중…');
    send({ type: 'generate', id: genPick });
  };

  onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'state') {
      state = msg.state;
      if (msg.changed || (!sheetBlob && !sheetLoading)) requestSheet();
      renaming = null;
      busy = false;
      if (msg.changed) {
        addImage = null;
        $('add-name').value = '';
        $('add-file').textContent = '';
        $('add-preview').classList.add('hidden');
        $('publish').style.display = 'block';
      }
      render();
      if (msg.message) setStatus(msg.message, 'ok');
      else {
        var active = state.icons.filter(function (i) { return !i.archived; });
        var todo = active.filter(function (i) { return i.pins < state.rowCount; }).length;
        setStatus('아이콘 ' + active.length + '개 · mappin 필요 ' + todo + '개');
      }
    } else if (msg.type === 'reference') {
      composeSheet(msg.icons).then(function (blob) {
        sheetLoading = false;
        sheetBlob = blob;
        settleSheet(blob);
      });
      return;
    } else if (msg.type === 'reference-error') {
      sheetLoading = false;
      settleSheet(null, new Error(msg.message));
      return;
    } else if (msg.type === 'error') {
      busy = false;
      render();
      setStatus(msg.message, 'error');
    }
  };

  send({ type: 'init' });
</script>
</body>
</html>
